<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Songs ❤️</title>
    <style>
        body {
            background-color: #ffe4e1; /* Soft Pink */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        header {
            background-color: #f0f0f0; /* Light Grey */
            width: 100%; padding: 20px 0; text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .back-btn {
            background-color: #ffffff; color: #333; padding: 8px 16px;
            font-size: 14px; border: 1px solid #ccc; border-radius: 20px;
            text-decoration: none; transition: 0.3s;
        }

        .back-btn:hover { background-color: #f9f9f9; border-color: #d63384; }

        .content {
            max-width: 1000px;
            width: 90%;
            padding: 40px 20px;
            text-align: center;
        }

        h2 { color: #d63384; font-size: 32px; margin-bottom: 10px; }
        .subtext { color: #888; font-style: italic; margin-bottom: 40px; display: block; }

        /* THE GRID */
        .songs-grid {
            display: grid;
            /* Creates 2 or 3 columns depending on screen size */
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 25px;
            width: 100%;
        }

        .song-wrapper {
            transition: transform 0.3s ease;
        }

        .song-wrapper:hover {
            transform: scale(1.03); /* Subtle lift on hover */
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            .songs-grid {
                grid-template-columns: 1fr; /* Single column on phones */
            }
        }
    </style>
</head>
<body>
