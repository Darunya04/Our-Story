<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Reasons Why ❤️</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ballet:opsz@16..72&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #ffe4e1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; 
        }

        header {
            background-color: #f0f0f0;
            width: 100%; padding: 20px 0; text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
        }

        /* 2. Applying Ballet to Headers */
        h1, h2 {
            font-family: 'Ballet', cursive;
            font-weight: 400;
        }

        h1 { font-size: 3rem; margin-bottom: 10px; color: #333; }
        h2 { color: #d63384; margin-bottom: 30px; font-size: 3.5rem; }

        .back-btn {
            background-color: #ffffff; color: #333; padding: 8px 16px;
            font-size: 14px; border: 1px solid #ccc; border-radius: 20px;
            text-decoration: none;
            font-family: 'Segoe UI', sans-serif;
        }

        .content {
            max-width: 1200px;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            z-index: 5;
        }

        .reasons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 10px;
        }

        .reason-card {
            background-color: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            font-size: 15px;
            color: #444;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 110px;
            transition: transform 0.2s;
            border: 1px solid #f9f9f9;
        }

        .reason-card:hover {
            transform: translateY(-5px);
            background-color: #fffafb;
            border-color: #ffb6c1;
        }

        /* 3. Using Ballet for the numbers to make them look artistic */
        .number { 
            font-family: 'Ballet', cursive;
            font-weight: bold; 
            color: #d63384; 
            margin-bottom: 2px; 
            font-size: 24px;
        }

        /* HEART CONFETTI STYLE */
        .confetti {
            position: fixed;
            top: -20px;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }

        @media (max-width: 950px) { .reasons-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 500px) { .reasons-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <h1>Our Story❤️</h1>
        <nav><a href="index.html" class="back-btn">← Back Home</a></nav>
    </header>

    <div class="content">
        <h2>100 Reasons I Love You</h2>
        
        <div class="reasons-grid">
            <div class="reason-card"><span class="number">1</span><span>The way my heart still skips a beat when you hold my hand.</span></div>
            <div class="reason-card"><span class="number">2</span><span>How you make me feel like I’m finally home, no matter where we are.</span></div>
            <div class="reason-card"><span class="number">100</span><span>Because 100 reasons still isn't enough to explain it.</span></div>
        </div>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('confetti');
            heart.innerText = '❤️';
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's'; 
            heart.style.opacity = Math.random();
            heart.style.fontSize = Math.random() * 15 + 10 + 'px';
            
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 150); // Slightly slowed down to keep it elegant
    </script>

</body>
</html>
